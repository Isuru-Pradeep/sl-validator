name: Bug report
description: A value is accepted or rejected wrongly, or the library misbehaves
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: sl-validator version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code to reproduce
      description: The smallest call that shows the problem. Do not paste real NIC or phone numbers; change the digits.
      render: java
      placeholder: |
        Nic.isValid("853400937V");
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      placeholder: "Expected true, got false"
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: "17"
